name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build web prototype for /leora/app
        working-directory: app
        env:
          EXPO_BASE_URL: /leora/app
        run: |
          npm ci
          npx expo export --platform web --output-dir ../site/app
          # GitHub Pages serves 404.html for unknown paths → deep links work in the SPA.
          cp ../site/app/index.html ../site/app/404.html

      - name: Add landing page at the site root
        run: cp -r landing/. site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
